[pytest]

pythonpath = .

# Путь к папке с тестами
testpaths = tests

# Аргументы запуска
addopts =
    -v
    --tb=short
    --strict-markers
    --screenshot only-on-failure
    --tracing retain-on-failure

# Маркеры
markers =
    example_marker: example description

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
